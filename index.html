<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Miner: Galactic Tycoon</title>
    <style>
        :root {
            --neon-blue: #00d4ff;
            --neon-purple: #9d00ff;
            --glass: rgba(255, 255, 255, 0.1);
        }
        body {
            background: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%);
            color: white; font-family: 'Segoe UI', sans-serif;
            margin: 0; overflow: hidden; display: flex; flex-direction: column; align-items: center; height: 100vh;
        }

        #top-nav {
            display: flex; justify-content: space-between; align-items: center;
            width: 100%; padding: 15px 25px; background: rgba(0, 0, 0, 0.8);
            border-bottom: 2px solid var(--neon-blue); box-sizing: border-box;
        }

        .crystal-display {
            font-size: 2.2rem; font-weight: bold; color: var(--neon-blue);
            text-shadow: 0 0 15px var(--neon-blue);
        }

        #main-container {
            display: flex; width: 100%; height: 100%;
            justify-content: space-around; align-items: center; padding: 20px; box-sizing: border-box;
        }

        .side-panel {
            width: 320px; background: var(--glass); backdrop-filter: blur(12px);
            border-radius: 20px; padding: 20px; border: 1px solid rgba(255,255,255,0.1);
            height: 75vh; display: flex; flex-direction: column; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
        }

        #asteroid-clicker { position: relative; cursor: pointer; transition: transform 0.1s; }
        #asteroid-clicker:active { transform: scale(0.92); }
        #asteroid-img { width: 280px; filter: drop-shadow(0 0 30px rgba(0, 212, 255, 0.2)); }

        .shop-btn {
            background: var(--neon-blue); border: none; color: black;
            padding: 14px; border-radius: 10px; font-weight: bold;
            cursor: pointer; margin-bottom: 12px; transition: 0.2s;
        }
        .shop-btn:disabled { background: #444; color: #888; cursor: not-allowed; }

        /* --- SLOW PULSE OWNER PANEL --- */
        #admin-panel {
            display: none; 
            padding: 15px; border-radius: 15px; margin-top: 10px;
            border: 3px solid white;
            animation: slowStrobe 3s infinite ease-in-out; /* Much slower 3-second pulse */
        }

        @keyframes slowStrobe {
            0% { background: rgba(200, 0, 0, 0.6); box-shadow: 0 0 15px red; }
            50% { background: rgba(0, 0, 200, 0.6); box-shadow: 0 0 15px blue; }
            100% { background: rgba(200, 0, 0, 0.6); box-shadow: 0 0 15px red; }
        }

        .admin-group { display: flex; gap: 5px; margin-bottom: 8px; }
        .admin-btn {
            background: white; color: black; flex: 2; 
            border: none; padding: 10px; cursor: pointer; font-weight: bold; border-radius: 5px;
        }
        .disable-btn {
            background: #000; color: #ff4444; flex: 1;
            border: 1px solid #ff4444; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 0.7rem;
        }
        .danger-btn {
            background: #ff4444; color: white; width: 100%; border: none; 
            padding: 10px; border-radius: 5px; font-weight: bold; cursor: pointer;
            margin-top: 5px; text-transform: uppercase;
        }

        #secret-input {
            width: 100%; background: rgba(255,255,255,0.1); border: 1px solid #444;
            color: #fff; padding: 8px; border-radius: 5px; text-align: center; margin-top: 10px;
        }

        .floating-num {
            position: absolute; color: var(--neon-blue); font-weight: bold;
            pointer-events: none; animation: floatUp 0.8s ease-out forwards;
            font-size: 1.5rem; text-shadow: 0 0 5px black; z-index: 100;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-120px); }
        }
    </style>
</head>
<body>

    <div id="top-nav">
        <div class="crystal-display">💎 <span id="crystal-count">0</span></div>
        <div id="user-info">
            <button id="login-btn" style="background: white; padding: 5px 10px; border-radius: 5px; cursor: pointer; border:none;">Sign in with Google</button>
            <span id="player-name" style="display:none; font-weight: bold; color: var(--neon-blue);"></span>
        </div>
    </div>

    <div id="main-container">
        <div class="side-panel">
            <h2 style="text-align:center; color:var(--neon-blue); margin-top:0;">🏆 Hall of Fame</h2>
            <div id="leaderboard-content" style="overflow-y:auto; flex:1">
                <div class="leader-item" style="display:flex; justify-content:space-between; padding:10px; border-bottom: 1px solid #333;"><span>1. NovaStrike</span> <span>5.0M</span></div>
                <div class="leader-item" style="display:flex; justify-content:space-between; padding:10px; border-bottom: 1px solid #333;"><span>2. CometCrasher</span> <span>1.2M</span></div>
                <div class="leader-item" style="display:flex; justify-content:space-between; padding:10px; background: rgba(0,212,255,0.1);"><span>YOU</span> <span id="my-best">0</span></div>
            </div>
        </div>

        <div id="asteroid-clicker">
            <img id="asteroid-img" src="https://cdn-icons-png.flaticon.com/512/2530/2530833.png" alt="Asteroid">
        </div>

        <div class="side-panel">
            <h2 style="text-align:center; margin-top:0;">⚙️ Upgrades</h2>
            <p style="text-align:center; font-size:0.9rem; color: #aaa;">CPS: <span id="cps-display">0</span></p>
            <button class="shop-btn" id="buy-drill" onclick="buyItem('drill')">🤖 Robo-Drill</button>
            <button class="shop-btn" id="buy-drone" onclick="buyItem('drone')">🛸 Drone Fleet</button>
            <button class="shop-btn" id="buy-cannon" onclick="buyItem('cannon')">🛰️ Plasma Cannon</button>
            
            <div id="admin-panel">
                <h3 style="margin:0 0 10px 0; color: white; text-align:center; text-shadow: 2px 2px black;">OWNER PANEL</h3>
                
                <div class="admin-group">
                    <button class="admin-btn" onclick="addMoney()">+1B Crystals</button>
                </div>

                <div class="admin-group">
                    <button class="admin-btn" onclick="superSpeed()">10x CPS Boost</button>
                    <button class="disable-btn" onclick="disableSpeed()">OFF</button>
                </div>

                <div class="admin-group">
                    <button class="admin-btn" onclick="godMode()">God Click</button>
                    <button class="disable-btn" onclick="disableGod()">OFF</button>
                </div>

                <button class="danger-btn" onclick="fullReset()">Reset Player (To 0)</button>
            </div>

            <input type="text" id="secret-input" placeholder="Secret Code..." oninput="checkCode()">

            <button id="reset-btn" style="background:transparent; color:#888; border:none; cursor:pointer; margin-top:auto; font-size: 0.7rem;" onclick="location.reload()">Refresh Page</button>
        </div>
    </div>

    <script>
        let crystals = parseFloat(localStorage.getItem('crystals')) || 0;
        let cps = parseFloat(localStorage.getItem('cps')) || 0;
        let originalCps = cps;
        let drillCost = 15;
        let droneCost = 100;
        let cannonCost = 500;
        let godClickActive = false;

        function checkCode() {
            const input = document.getElementById('secret-input');
            if (input.value === 'OWNERISBETTER') {
                document.getElementById('admin-panel').style.display = 'block';
                input.value = ""; // CLEARS THE CODE BOX
                input.style.display = 'none'; // HIDES THE BOX
            }
        }

        // --- OWNER FUNCTIONS ---
        function addMoney() { crystals += 1000000000; updateUI(); }
        
        function superSpeed() { 
            if (cps > 0) originalCps = cps; 
            cps = (cps <= 0) ? 1000 : cps * 10; 
            updateUI(); 
        }
        function disableSpeed() { cps = originalCps; updateUI(); }

        function godMode() { godClickActive = true; }
        function disableGod() { godClickActive = false; }

        function fullReset() {
            if(confirm("OWNER: Are you sure you want to reset EVERYTHING to 0?")) {
                crystals = 0;
                cps = 0;
                originalCps = 0;
                localStorage.clear();
                updateUI();
                alert("Player has been reset to 0.");
            }
        }

        // --- CORE GAME ---
        function updateUI() {
            document.getElementById('crystal-count').innerText = Math.floor(crystals).toLocaleString();
            document.getElementById('my-best').innerText = Math.floor(crystals).toLocaleString();
            document.getElementById('cps-display').innerText = cps.toFixed(1);
            
            document.getElementById('buy-drill').disabled = crystals < drillCost;
            document.getElementById('buy-drone').disabled = crystals < droneCost;
            document.getElementById('buy-cannon').disabled = crystals < cannonCost;

            localStorage.setItem('crystals', crystals);
            localStorage.setItem('cps', cps);
        }

        document.getElementById('asteroid-clicker').onclick = (e) => {
            let power = godClickActive ? 1000000000 : (1 + (cps * 0.15));
            crystals += power;
            
            const num = document.createElement('div');
            num.className = 'floating-num';
            num.innerText = "+" + Math.floor(power).toLocaleString();
            num.style.left = e.clientX + 'px';
            num.style.top = e.clientY + 'px';
            if(godClickActive) num.style.color = "#FFD700";
            document.body.appendChild(num);
            setTimeout(() => num.remove(), 800);
            updateUI();
        };

        function buyItem(item) {
            if(item === 'drill' && crystals >= drillCost) { crystals -= drillCost; cps += 1; }
            if(item === 'drone' && crystals >= droneCost) { crystals -= droneCost; cps += 8; }
            if(item === 'cannon' && crystals >= cannonCost) { crystals -= cannonCost; cps += 40; }
            updateUI();
        }

        const loginBtn = document.getElementById('login-btn');
        loginBtn.onclick = () => {
            let name = prompt("Enter Google Username:");
            if(name) {
                loginBtn.style.display = 'none';
                document.getElementById('player-name').innerText = "👨‍🚀 " + name;
                document.getElementById('player-name').style.display = 'block';
            }
        };

        setInterval(() => {
            crystals += (cps / 10);
            updateUI();
        }, 100);

        updateUI();
    </script>
</body>
</html>
