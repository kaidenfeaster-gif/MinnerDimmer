<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Miner: Galactic Tycoon</title>
    <style>
        :root {
            --neon-blue: #00d4ff;
            --neon-purple: #9d00ff;
            --glass: rgba(255, 255, 255, 0.1);
        }
        body {
            background: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%);
            color: white; font-family: 'Segoe UI', sans-serif;
            margin: 0; overflow: hidden; display: flex; flex-direction: column; align-items: center; height: 100vh;
        }

        #top-nav {
            display: flex; justify-content: space-between; align-items: center;
            width: 100%; padding: 15px 25px; background: rgba(0, 0, 0, 0.8);
            border-bottom: 2px solid var(--neon-blue); box-sizing: border-box;
        }

        .crystal-display {
            font-size: 2.2rem; font-weight: bold; color: var(--neon-blue);
            text-shadow: 0 0 15px var(--neon-blue);
        }

        #main-container {
            display: flex; width: 100%; height: 100%;
            justify-content: space-around; align-items: center; padding: 20px; box-sizing: border-box;
        }

        .side-panel {
            width: 320px; background: var(--glass); backdrop-filter: blur(12px);
            border-radius: 20px; padding: 20px; border: 1px solid rgba(255,255,255,0.1);
            height: 75vh; display: flex; flex-direction: column; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
        }

        #asteroid-clicker { position: relative; cursor: pointer; transition: transform 0.1s; }
        #asteroid-clicker:active { transform: scale(0.92); }
        #asteroid-img { width: 280px; filter: drop-shadow(0 0 30px rgba(0, 212, 255, 0.2)); }

        .leader-item {
            display: flex; justify-content: space-between; padding: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.95rem;
        }
        .leader-item.me { color: var(--neon-blue); font-weight: bold; background: rgba(0, 212, 255, 0.1); border-radius: 8px; }

        .shop-btn {
            background: var(--neon-blue); border: none; color: black;
            padding: 14px; border-radius: 10px; font-weight: bold;
            cursor: pointer; margin-bottom: 12px; transition: 0.2s;
        }
        .shop-btn:disabled { background: #444; color: #888; cursor: not-allowed; }
        .shop-btn:hover:not(:disabled) { transform: scale(1.03); filter: brightness(1.2); }

        #login-btn {
            background: white; color: black; padding: 10px 20px;
            border-radius: 8px; font-weight: bold; cursor: pointer; border: none;
        }

        /* --- NEW: Secret Admin Styling --- */
        #admin-panel {
            display: none; /* Hidden by default */
            background: linear-gradient(45deg, #800000, #330000);
            border: 2px solid #ff0000;
            padding: 15px; border-radius: 15px; margin-top: 10px;
        }
        .admin-btn {
            background: #ff0000; color: white; width: 100%; 
            margin-bottom: 5px; border: none; padding: 8px; cursor: pointer; font-weight: bold;
        }
        #secret-input {
            width: 100%; background: rgba(0,0,0,0.5); border: 1px dashed #555;
            color: #555; padding: 5px; border-radius: 5px; text-align: center; font-size: 0.7rem;
        }

        .floating-num {
            position: absolute; color: var(--neon-blue); font-weight: bold;
            pointer-events: none; animation: floatUp 0.8s ease-out forwards;
            font-size: 1.5rem; text-shadow: 0 0 5px black;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-120px); }
        }
    </style>
</head>
<body>

    <div id="top-nav">
        <div class="crystal-display">💎 <span id="crystal-count">0</span></div>
        <div id="user-info">
            <button id="login-btn">Sign in with Google</button>
            <span id="player-name" style="display:none; font-weight: bold; color: var(--neon-blue);"></span>
        </div>
    </div>

    <div id="main-container">
        <div class="side-panel">
            <h2 style="text-align:center; color:var(--neon-blue); margin-top:0;">🏆 Hall of Fame</h2>
            <div id="leaderboard-content" style="overflow-y:auto; flex:1">
                <div class="leader-item"><span>1. NovaStrike</span> <span>5.0M</span></div>
                <div class="leader-item"><span>2. CometCrasher</span> <span>1.2M</span></div>
                <div class="leader-item"><span>3. StarDust</span> <span>500K</span></div>
                <div class="leader-item me"><span>YOU</span> <span id="my-best">0</span></div>
            </div>
            <p style="font-size:0.75rem; color:#888; text-align:center; margin-top:10px;">Beat the AI legends!</p>
        </div>

        <div id="asteroid-clicker">
            <img id="asteroid-img" src="https://cdn-icons-png.flaticon.com/512/2530/2530833.png" alt="Asteroid">
        </div>

        <div class="side-panel">
            <h2 style="text-align:center; margin-top:0;">⚙️ Upgrades</h2>
            <p style="text-align:center; font-size:0.9rem; color: #aaa;">CPS: <span id="cps-display">0</span></p>
            <button class="shop-btn" id="buy-drill">🤖 Robo-Drill (Cost: 15)</button>
            <button class="shop-btn" id="buy-drone">🛸 Drone Fleet (Cost: 100)</button>
            <button class="shop-btn" id="buy-cannon">🛰️ Plasma Cannon (Cost: 500)</button>
            <button class="shop-btn" id="buy-base">🚀 Moon Base (Cost: 2.5K)</button>
            
            <div id="admin-panel">
                <h4 style="margin:0 0 10px 0; color: #ff0000; text-align:center;">OWNER PANEL</h4>
                <button class="admin-btn" onclick="addMoney()">+1B Crystals</button>
                <button class="admin-btn" onclick="superSpeed()">10x CPS Boost</button>
                <button class="admin-btn" onclick="godMode()">Enable God Click</button>
            </div>
            <input type="password" id="secret-input" placeholder="Enter Secret Code" oninput="checkCode()">

            <button id="reset-btn" style="background:transparent; color:#ff4444; border:none; cursor:pointer; margin-top:auto; font-size: 0.8rem;">Wipe Data</button>
        </div>
    </div>

    <script>
        let crystals = parseFloat(localStorage.getItem('crystals')) || 0;
        let cps = parseFloat(localStorage.getItem('cps')) || 0;
        let drillCost = parseFloat(localStorage.getItem('drillCost')) || 15;
        let droneCost = parseFloat(localStorage.getItem('droneCost')) || 100;
        let cannonCost = parseFloat(localStorage.getItem('cannonCost')) || 500;
        let baseCost = parseFloat(localStorage.getItem('baseCost')) || 2500;
        let godClickActive = false;

        // --- CODE CHECKER ---
        function checkCode() {
            const input = document.getElementById('secret-input');
            if (input.value === 'ownerisbetter') {
                document.getElementById('admin-panel').style.display = 'block';
                input.style.display = 'none'; // Hide input once activated
            }
        }

        // --- ADMIN POWERS ---
        function addMoney() { crystals += 1000000000; updateUI(); }
        function superSpeed() { cps *= 10; updateUI(); }
        function godMode() { godClickActive = true; alert("God Click Enabled!"); }

        const loginBtn = document.getElementById('login-btn');
        const playerNameDisp = document.getElementById('player-name');

        loginBtn.addEventListener('click', () => {
            let name = prompt("Enter your Google Username:");
            if(name) {
                loginBtn.style.display = 'none';
                playerNameDisp.innerText = "👨‍🚀 " + name;
                playerNameDisp.style.display = 'block';
                localStorage.setItem('pilotName', name);
            }
        });

        if(localStorage.getItem('pilotName')) {
            loginBtn.style.display = 'none';
            playerNameDisp.innerText = "👨‍🚀 " + localStorage.getItem('pilotName');
            playerNameDisp.style.display = 'block';
        }

        function updateUI() {
            document.getElementById('crystal-count').innerText = Math.floor(crystals).toLocaleString();
            document.getElementById('my-best').innerText = Math.floor(crystals).toLocaleString();
            document.getElementById('cps-display').innerText = cps.toFixed(1);
            
            document.getElementById('buy-drill').innerText = `🤖 Robo-Drill (${Math.floor(drillCost)})`;
            document.getElementById('buy-drone').innerText = `🛸 Drone Fleet (${Math.floor(droneCost)})`;
            document.getElementById('buy-cannon').innerText = `🛰️ Plasma Cannon (${Math.floor(cannonCost)})`;
            document.getElementById('buy-base').innerText = `🚀 Moon Base (${Math.floor(baseCost)})`;

            document.getElementById('buy-drill').disabled = crystals < drillCost;
            document.getElementById('buy-drone').disabled = crystals < droneCost;
            document.getElementById('buy-cannon').disabled = crystals < cannonCost;
            document.getElementById('buy-base').disabled = crystals < baseCost;

            localStorage.setItem('crystals', crystals);
            localStorage.setItem('cps', cps);
            localStorage.setItem('drillCost', drillCost);
            localStorage.setItem('droneCost', droneCost);
            localStorage.setItem('cannonCost', cannonCost);
            localStorage.setItem('baseCost', baseCost);
        }

        document.getElementById('asteroid-clicker').addEventListener('click', (e) => {
            let power = godClickActive ? 1000000 : (1 + (cps * 0.15));
            crystals += power;
            
            const num = document.createElement('div');
            num.className = 'floating-num';
            num.innerText = "+" + Math.floor(power).toLocaleString();
            num.style.left = e.clientX + 'px';
            num.style.top = e.clientY + 'px';
            if(godClickActive) num.style.color = "gold";
            document.body.appendChild(num);
            setTimeout(() => num.remove(), 800);
            updateUI();
        });

        document.getElementById('buy-drill').onclick = () => {
            if(crystals >= drillCost) { crystals -= drillCost; cps += 1; drillCost *= 1.2; updateUI(); }
        }
        document.getElementById('buy-drone').onclick = () => {
            if(crystals >= droneCost) { crystals -= droneCost; cps += 8; droneCost *= 1.25; updateUI(); }
        }
        document.getElementById('buy-cannon').onclick = () => {
            if(crystals >= cannonCost) { crystals -= cannonCost; cps += 40; cannonCost *= 1.3; updateUI(); }
        }
        document.getElementById('buy-base').onclick = () => {
            if(crystals >= baseCost) { crystals -= baseCost; cps += 150; baseCost *= 1.4; updateUI(); }
        }

        document.getElementById('reset-btn').onclick = () => {
            if(confirm("Delete all progress?")) { localStorage.clear(); location.reload(); }
        }

        setInterval(() => {
            crystals += (cps / 10);
            updateUI();
        }, 100);

        updateUI();
    </script>
</body>
</html>
