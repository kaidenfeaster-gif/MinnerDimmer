<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Miner: Galactic Tycoon</title>
    <style>
        :root {
            --neon-blue: #00d4ff;
            --neon-purple: #9d00ff;
        }
        body {
            background: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%);
            color: white;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
        }
        #stats-bar {
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            width: 100%;
            text-align: center;
            border-bottom: 2px solid var(--neon-blue);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
        }
        .crystal-count {
            font-size: 3rem;
            font-weight: bold;
            color: var(--neon-blue);
            text-shadow: 0 0 10px var(--neon-blue);
        }
        #game-area {
            flex: 1;
            display: flex;
            justify-content: space-around;
            align-items: center;
            width: 90%;
            max-width: 1200px;
        }
        /* Feature 2: Satisfying Asteroid */
        #asteroid-container { position: relative; }
        #asteroid {
            width: 250px;
            cursor: pointer;
            filter: drop-shadow(0 0 20px #555);
            transition: transform 0.05s;
            user-select: none;
        }
        #asteroid:hover { transform: scale(1.05) rotate(2deg); }
        #asteroid:active { transform: scale(0.9) rotate(-2deg); }

        /* Feature 1: Floating Text Animation */
        .click-text {
            position: absolute;
            color: var(--neon-blue);
            font-weight: bold;
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
            z-index: 100;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-100px); }
        }

        /* Feature 3: Better Shop UI */
        .shop {
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 320px;
            max-height: 80vh;
            overflow-y: auto;
        }
        .upgrade-card {
            background: rgba(0, 0, 0, 0.3);
            margin: 10px 0;
            padding: 15px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            border: 1px solid transparent;
            transition: 0.3s;
        }
        .upgrade-card:hover { border-color: var(--neon-blue); }
        
        button {
            background: var(--neon-blue);
            border: none;
            color: black;
            padding: 8px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }
        button:disabled { background: #444; opacity: 0.5; cursor: not-allowed; }
        
        /* Star background */
        #stars { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }
    </style>
</head>
<body>

    <div id="stats-bar">
        <div class="crystal-count" id="crystals">0</div>
        <div>Crystals Per Second: <span id="cps">0</span></div>
    </div>

    <div id="game-area">
        <div id="asteroid-container">
            <img id="asteroid" src="https://cdn-icons-png.flaticon.com/512/2530/2530833.png" alt="Asteroid">
        </div>

        <div class="shop">
            <h2 style="margin-top:0">Upgrades</h2>
            <div class="upgrade-card">
                <span>🤖 Robo-Drill (+1 CPS)</span>
                <button id="buy-1">Cost: 15</button>
            </div>
            <div class="upgrade-card">
                <span>🛸 Drone Fleet (+5 CPS)</span>
                <button id="buy-5">Cost: 75</button>
            </div>
            <div class="upgrade-card">
                <span>🛰️ Plasma Cannon (+20 CPS)</span>
                <button id="buy-10">Cost: 250</button>
            </div>
            <div class="upgrade-card" style="border: 1px solid gold;">
                <span>🌀 Quantum Boost (CPS x1.2)</span>
                <button id="buy-boost">Cost: 1000</button>
            </div>
            <button id="reset-btn" style="background: #ff4444; margin-top: 20px; width: 100%;">Reset Game</button>
        </div>
    </div>

    <canvas id="stars"></canvas>

    <script>
        // Data & Save System
        let crystals = parseFloat(localStorage.getItem('crystals')) || 0;
        let cps = parseFloat(localStorage.getItem('cps')) || 0;
        let cost1 = parseFloat(localStorage.getItem('cost1')) || 15;
        let cost5 = parseFloat(localStorage.getItem('cost5')) || 75;
        let cost10 = parseFloat(localStorage.getItem('cost10')) || 250;
        let costBoost = parseFloat(localStorage.getItem('costBoost')) || 1000;

        const crystalEl = document.getElementById('crystals');
        const cpsEl = document.getElementById('cps');
        const ast = document.getElementById('asteroid');

        function updateUI() {
            crystalEl.innerText = Math.floor(crystals).toLocaleString();
            cpsEl.innerText = cps.toFixed(1);
            
            document.getElementById('buy-1').innerText = `Cost: ${Math.floor(cost1)}`;
            document.getElementById('buy-5').innerText = `Cost: ${Math.floor(cost5)}`;
            document.getElementById('buy-10').innerText = `Cost: ${Math.floor(cost10)}`;
            document.getElementById('buy-boost').innerText = `Cost: ${Math.floor(costBoost)}`;

            document.getElementById('buy-1').disabled = crystals < cost1;
            document.getElementById('buy-5').disabled = crystals < cost5;
            document.getElementById('buy-10').disabled = crystals < cost10;
            document.getElementById('buy-boost').disabled = crystals < costBoost;
            
            ast.style.filter = `drop-shadow(0 0 ${Math.min(cps + 5, 50)}px var(--neon-blue))`;
            
            localStorage.setItem('crystals', crystals);
            localStorage.setItem('cps', cps);
            localStorage.setItem('cost1', cost1);
            localStorage.setItem('cost5', cost5);
            localStorage.setItem('cost10', cost10);
            localStorage.setItem('costBoost', costBoost);
        }

        // Click Logic with Scaling Power
        ast.addEventListener('click', (e) => {
            let clickPower = 1 + (cps * 0.1); // You get 10% of your CPS per click!
            crystals += clickPower;
            
            const text = document.createElement('div');
            text.className = 'click-text';
            text.innerText = '+' + clickPower.toFixed(1);
            text.style.left = e.clientX + 'px';
            text.style.top = e.clientY + 'px';
            document.body.appendChild(text);
            setTimeout(() => text.remove(), 800);
            updateUI();
        });

        // Upgrade Buying Events
        document.getElementById('buy-1').addEventListener('click', () => {
            if (crystals >= cost1) { crystals -= cost1; cps += 1; cost1 *= 1.15; updateUI(); }
        });

        document.getElementById('buy-5').addEventListener('click', () => {
            if (crystals >= cost5) { crystals -= cost5; cps += 5; cost5 *= 1.18; updateUI(); }
        });

        document.getElementById('buy-10').addEventListener('click', () => {
            if (crystals >= cost10) { crystals -= cost10; cps += 20; cost10 *= 1.22; updateUI(); }
        });

        document.getElementById('buy-boost').addEventListener('click', () => {
            if (crystals >= costBoost) { 
                crystals -= costBoost; 
                cps = cps === 0 ? 1 : cps * 1.2; // Multiplies total CPS by 20%
                costBoost *= 2.5; 
                updateUI(); 
            }
        });

        document.getElementById('reset-btn').addEventListener('click', () => {
            if(confirm("Are you sure you want to reset everything?")) {
                localStorage.clear();
                location.reload();
            }
        });

        // Background Animation
        const canvas = document.getElementById('stars');
        const ctx = canvas.getContext('2d');
        let stars = [];
        function initStars() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            stars = [];
            for(let i=0; i<100; i++) stars.push({x: Math.random()*canvas.width, y: Math.random()*canvas.height, s: Math.random()*2});
        }
        function drawStars() {
            ctx.clearRect(0,0,canvas.width, canvas.height);
            ctx.fillStyle = "white";
            stars.forEach(s => {
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.s, 0, Math.PI*2);
                ctx.fill();
                s.y += 0.2; if(s.y > canvas.height) s.y = 0;
            });
            requestAnimationFrame(drawStars);
        }
        initStars(); drawStars();

        // Smooth Game Loop
        setInterval(() => {
            crystals += (cps / 10);
            updateUI();
        }, 100);

        updateUI();
    </script>
</body>
</html>
